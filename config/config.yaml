# which site the chatbot answers from 
active_site: sklearn

# root folder for per-site data
data_dir: data

sites:
  sklearn:
    name: scikit-learn documentation (stable)
    base_url: https://scikit-learn.org/stable/
    allowed_domain: scikit-learn.org
    allowed_path_prefix: /stable/
    max_pages: 1200
    exclude_patterns:
      - '/_(downloads|images|sources|static|modules)/'
      - '\.(zip|ipynb|py|png|jpg|jpeg|gif|svg|pdf|txt|js|css)$'
      - '/(genindex|search|py-modindex)\.html$'
      - '/lite/'

  pytorch:
    name: PyTorch documentation (stable)
    base_url: https://pytorch.org/docs/stable/
    allowed_domain: pytorch.org
    allowed_path_prefix: /docs/stable/
    max_pages: 1000
    exclude_patterns:
      - '/_(downloads|images|sources|static|modules)/'
      - '\.(zip|ipynb|py|png|jpg|jpeg|gif|svg|pdf|txt|js|css)$'
      - '/(genindex|search|py-modindex)\.html$'

crawler:
    user_agent: "project/0.1 (university coursework project)"
    request_delay_seconds: 1.0
    timeout_seconds: 15
    max_retries: 2
    max_response_bytes: 5000000

chunking:
    max_chars: 1200
    min_chars: 200
    overlap_chars: 150

embedding: 
    model_name: BAAI/bge-small-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    batch_size: 32

retrieval:
    top_k: 5
    candidate_k: 50
    rrf_k: 60

llm:
    model: llama3.1:8b
    base_url: http://localhost:11434
    temperature: 0.0
    num_ctx: 8192
    timeout_seconds: 120